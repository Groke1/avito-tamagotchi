name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "backend/**"
      - "docker-compose.test.yml"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.2"

jobs:
  ci:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest

      - name: Run linter
        run: make lint

      - name: Generate mocks
        run: make generate

      - name: Run unit tests
        run: make unit-tests

      - name: Run integration tests
        run: make test