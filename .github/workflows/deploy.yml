name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "backend/**"
      - "frontend/**"
      - "docker-compose.prod.yaml"
      - ".env.prod.example"
      - "Makefile"

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.meta.outputs.image_prefix }}

    steps:
      - name: Compute image prefix
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_prefix=ghcr.io/${owner}/avito-gamification-hackathon" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: users
            dockerfile: ./backend/user/Dockerfile
            build_args: ""
          - name: tasks
            dockerfile: ./backend/tasks/Dockerfile
            build_args: ""
          - name: pets
            dockerfile: ./backend/pets/Dockerfile
            build_args: ""
          - name: frontend
            dockerfile: ./frontend/Dockerfile
            build_args: |
              VITE_API_URL=/api/v1
              VITE_API_PET_URL=/pet
              VITE_API_TASKS_URL=/tasks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}-${{ matrix.name }}:${{ github.sha }}
            ${{ needs.prepare.outputs.image_prefix }}-${{ matrix.name }}:latest

  upload-deploy-files:
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose and migrations to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          target: ${{ secrets.DEPLOY_PATH }}
          source: "docker-compose.prod.yaml,backend/pets/migrations"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-and-push
      - upload-deploy-files
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN,IMAGE_PREFIX,IMAGE_TAG
          script: |
            set -eu
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -f .env.prod ]; then
              echo ".env.prod was not found in $DEPLOY_PATH"
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.prod -f docker-compose.prod.yaml pull
            IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env.prod -f docker-compose.prod.yaml up -d --remove-orphans

            docker image prune -f
