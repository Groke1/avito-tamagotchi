services:
  users:
    image: users-test
    build:
      context: .
      dockerfile: ./backend/user/Dockerfile
    environment:
      HTTP_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: "12345"
      JWT_SECRET: integration-tests-secret-at-least-32-bytes
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      TOKEN_CLEANUP_INTERVAL: 24h
      SHUTDOWN_TIMEOUT: 5s
      REGISTRATION_BONUS_COINS: "100"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: "12345"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d db"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  integration-tests:
    build:
      context: .
      dockerfile: ./backend/integration-tests/Dockerfile
    environment:
      USERS_BASE_URL: http://users:8080/api/v1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: "12345"
    depends_on:
      users:
        condition: service_started
      postgres:
        condition: service_healthy