services:
  users:
    image: users
    env_file:
      - .env.example
    hostname: users
    build:
      context: .
      dockerfile: ./backend/user/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: "db"
      POSTGRES_USER: "db_user"
      POSTGRES_PASSWORD: "12345"
      POSTGRES_PORT: "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "port=5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U db_user -d db" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: