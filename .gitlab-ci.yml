stages:
  - sync

mirror_to_github:
  stage: sync
  image:
    name: alpine/git:latest
    entrypoint: [""]

  script:
    - echo "Starting GitHub sync"
    - git push "https://fnkdnm:${GITHUB_TOKEN}@github.com/nektosomebody/avito-tamagotchi.git" "HEAD:refs/heads/${CI_COMMIT_BRANCH}"

  rules:
    - if: '$CI_COMMIT_BRANCH'