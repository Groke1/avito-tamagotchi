version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/user/queries.sql"
    schema: "migrations/migrations"
    gen:
      go:
        package: "user"
        sql_package: "pgx/v5"
        out: "internal/repository/user/sqlc"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
