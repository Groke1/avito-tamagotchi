openapi: 3.0.3
info:
  title: User Service API
  version: 1.0.0
  description: |
    API микросервиса пользователей.

tags:
  - name: Auth
    description: Регистрация и управление сессией
  - name: Profile
    description: Профиль текущего пользователя
  - name: Rewards
    description: Награды текущего пользователя
  - name: Internal
    description: Внутренние методы межсервисного взаимодействия

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Зарегистрировать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: ivan
              email: ivan@example.com
              password: strong-password
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/UserAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Выполнить вход
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ivan@example.com
              password: strong-password
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Обновить пару токенов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: eyJhbGciOiJIUzI1NiJ9...
      responses:
        '200':
          description: Токены обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [ Auth ]
      operationId: logoutUser
      summary: Завершить текущую сессию
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refresh_token: eyJhbGciOiJIUzI1NiJ9...
      responses:
        '204':
          description: Сессия завершена или уже была завершена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Получить профиль текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              example:
                user_id: 5dc2c52d-8dc9-4ca8-a51f-cd03a507ce63
                username: ivan
                email: ivan@example.com
                coins: 150
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'


  /api/v1/rewards:
    get:
      tags: [Rewards]
      operationId: getAllRewards
      summary: Получить все награды текущего пользователя
      description: Возвращает активные, использованные и истекшие награды. Поля `expires_at` и `redeemed-at` могут быть `null` - значит у промокода нет ограничения по времени или он еще не использован соответственно
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список наград пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRewardsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rewards/active:
    get:
      tags: [Rewards]
      operationId: getActiveRewards
      summary: Получить доступные награды текущего пользователя
      description: Возвращает награды со статусом `active`. Поля `expires_at` и `redeemed-at` могут быть `null` - значит у промокода нет ограничения по времени или он еще не использован соответственно
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список доступных наград пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRewardsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rewards/{reward_id}:
    get:
      tags: [Rewards]
      operationId: getReward
      summary: Получить награду текущего пользователя
      description: Возвращает награду только в том случае, если она принадлежит пользователю из access token.
      security:
        - bearerAuth: []
      parameters:
        - name: reward_id
          in: path
          required: true
          description: Идентификатор пользовательской награды
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Награда пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRewardResponse'
              examples:
                active:
                  summary: Активная награда
                  value:
                    reward_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    promo_code: DELIVERYDISC-X8K2M7Q9WP
                    name: Скидка 10% на доставку
                    description: Скидка 10% на одну покупку с Авито Доставкой
                    status: active
                    expires_at: '2026-09-06T19:07:12Z'
                    redeemed_at: null
                redeemed:
                  summary: Использованная награда
                  value:
                    reward_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    promo_code: DELIVERYDISC-X8K2M7Q9WP
                    name: Скидка 10% на доставку
                    description: Скидка 10% на одну покупку с Авито Доставкой
                    status: redeemed
                    expires_at: '2026-09-06T19:07:12Z'
                    redeemed_at: '2026-08-06T19:07:12Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RewardNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rewards/redeem:
    post:
      tags: [Rewards]
      operationId: redeemReward
      summary: Использовать промокод текущего пользователя
      description: Помечает доступную награду использованной. Пользователь определяется по access token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRewardRequest'
            example:
              promo_code: DELIVERYDISC-X8K2M7Q9WP
      responses:
        '204':
          description: Награда успешно использована
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RewardUnavailable'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/action:
    post:
      tags: [Internal]
      operationId: registerUserAction
      summary: Зарегистрировать действие пользователя
      description: Обновляет стрик пользователя на основании времени совершения действия.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
            example:
              user_id: 5dc2c52d-8dc9-4ca8-a51f-cd03a507ce63
              occurred_at: '2026-08-06T19:07:12Z'
      responses:
        '204':
          description: Действие учтено, стрик пользователя обновлён
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/rewards:
    post:
      tags: [Internal]
      operationId: grantReward
      summary: Выдать награду пользователю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRewardRequest'
            example:
              user_id: 5dc2c52d-8dc9-4ca8-a51f-cd03a507ce63
              code: DELIVERY_DISCOUNT_10
      responses:
        '201':
          description: Награда выдана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRewardResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/rewards/{code}:
    get:
      tags: [Internal]
      operationId: getRewardDefinition
      summary: Получить описание награды по коду
      parameters:
        - name: code
          in: path
          required: true
          description: Стабильный межсервисный код награды
          schema:
            type: string
            minLength: 1
          example: DELIVERY_DISCOUNT_10
      responses:
        '200':
          description: Описание награды
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardDefinitionResponse'
        '404':
          $ref: '#/components/responses/RewardDefinitionNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/usernames:
    post:
      tags: [Internal]
      operationId: getUsernames
      summary: Получить имена пользователей по идентификаторам
      description: Принимает от 1 до 1000 идентификаторов пользователей.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernamesRequest'
            example:
              user_ids:
                - 5dc2c52d-8dc9-4ca8-a51f-cd03a507ce63
                - a17ce10d-8cac-41cf-a283-c9f38166c296
      responses:
        '200':
          description: Найденные пользователи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernamesResponse'
              example:
                users:
                  - id: 5dc2c52d-8dc9-4ca8-a51f-cd03a507ce63
                    username: ivan
                  - id: a17ce10d-8cac-41cf-a283-c9f38166c296
                    username: maria
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /internal/update-coins:
    put:
      tags: [Internal]
      operationId: updateUserCoins
      summary: Изменить баланс монет пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCoinsRequest'
            examples:
              accrue:
                summary: Начисление монет
                value:
                  user_id: 5dc2c52d-8dc9-4ca8-a51f-cd03a507ce63
                  delta: 25
              debit:
                summary: Списание монет
                value:
                  user_id: 5dc2c52d-8dc9-4ca8-a51f-cd03a507ce63
                  delta: -10
      responses:
        '200':
          description: Баланс успешно изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCoinsResponse'
              example:
                user_id: 5dc2c52d-8dc9-4ca8-a51f-cd03a507ce63
                coins: 175
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/InsufficientCoins'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token в заголовке `Authorization: Bearer <token>`."

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 40
          description: Имя пользователя после удаления пробелов по краям.
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
          description: От 8 до 72 байт в UTF-8 представлении.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          writeOnly: true

    LogoutRequest:
      type: object
      additionalProperties: false
      required: [ refresh_token ]
      properties:
        refresh_token:
          type: string
          minLength: 1
          writeOnly: true

    AuthResponse:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
          readOnly: true
        refresh_token:
          type: string
          readOnly: true

    ProfileResponse:
      type: object
      additionalProperties: false
      required: [user_id, username, email, coins]
      properties:
        user_id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        coins:
          type: integer
          format: int64
          minimum: 0

    UsernamesRequest:
      type: object
      additionalProperties: false
      required: [user_ids]
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string

    Username:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string

    UsernamesResponse:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/Username'

    UpdateCoinsRequest:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: string
        delta:
          type: integer
          format: int64

    UpdateCoinsResponse:
      type: object
      additionalProperties: false
      required: [user_id, coins]
      properties:
        user_id:
          type: string
          readOnly: true
        coins:
          type: integer
          format: int64
          minimum: 0
          readOnly: true


    RewardStatus:
      type: string
      description: Эффективный статус награды. Значение `expired` вычисляется по `expires_at`.
      enum: [active, redeemed, expired]

    UserRewardResponse:
      type: object
      additionalProperties: false
      example:
        reward_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        promo_code: DELIVERYDISC-X8K2M7Q9WP
        name: Скидка 10% на доставку
        description: Скидка 10% на одну покупку с Авито Доставкой
        status: active
        expires_at: '2026-09-06T19:07:12Z'
        redeemed_at: null
      required:
        - reward_id
        - promo_code
        - name
        - description
        - status
        - expires_at
        - redeemed_at
      properties:
        reward_id:
          type: string
          format: uuid
          readOnly: true
        promo_code:
          type: string
          readOnly: true
          example: DELIVERYDISC-X8K2M7Q9WP
        name:
          type: string
          readOnly: true
          example: Скидка 10% на доставку
        description:
          type: string
          readOnly: true
          example: Скидка 10% на одну покупку с Авито Доставкой
        status:
          allOf:
            - $ref: '#/components/schemas/RewardStatus'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        redeemed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    UserRewardsResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserRewardResponse'

    RedeemRewardRequest:
      type: object
      additionalProperties: false
      required: [promo_code]
      properties:
        promo_code:
          type: string
          minLength: 1
          example: DELIVERYDISC-X8K2M7Q9WP

    ActionRequest:
      type: object
      additionalProperties: false
      required: [user_id, occurred_at]
      properties:
        user_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time

    GrantRewardRequest:
      type: object
      additionalProperties: false
      required: [user_id, code]
      properties:
        user_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          example: DELIVERY_DISCOUNT_10

    RewardDefinitionResponse:
      type: object
      additionalProperties: false
      required: [code, name, description]
      properties:
        code:
          type: string
          readOnly: true
          example: DELIVERY_DISCOUNT_10
        name:
          type: string
          readOnly: true
          example: Скидка 10% на доставку
        description:
          type: string
          readOnly: true
          example: Скидка 10% на одну покупку с Авито Доставкой

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - USER_ALREADY_EXISTS
            - VALIDATION_ERROR
            - INTERNAL_ERROR
            - INVALID_CREDENTIALS
            - INVALID_REFRESH_TOKEN
            - UNAUTHORIZED
            - USER_NOT_FOUND
            - INSUFFICIENT_COINS
            - REWARD_NOT_FOUND
            - REWARD_UNAVAILABLE
            - NOT_FOUND_DEFINITION
        message:
          type: string

  responses:
    ValidationError:
      description: Некорректное тело запроса или данные не прошли валидацию
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: Проверьте переданные данные

    UserAlreadyExists:
      description: Пользователь с таким именем или email уже существует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: USER_ALREADY_EXISTS
            message: Пользователь с такими данными уже существует

    InvalidCredentials:
      description: Неверный email или пароль
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_CREDENTIALS
            message: Неверный email или пароль

    InvalidRefreshToken:
      description: Refresh token отсутствует, недействителен или не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_REFRESH_TOKEN
            message: Сессия истекла. Выполните вход снова

    Unauthorized:
      description: Access token отсутствует или недействителен либо пользователь не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: Требуется повторная авторизация

    UserNotFound:
      description: Пользователь не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: USER_NOT_FOUND
            message: Пользователь не найден

    InsufficientCoins:
      description: На балансе недостаточно монет для списания
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INSUFFICIENT_COINS
            message: Недостаточно монет


    RewardNotFound:
      description: Награда не найдена либо не принадлежит текущему пользователю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: REWARD_NOT_FOUND
            message: Награда не найдена

    RewardUnavailable:
      description: Промокод не найден, принадлежит другому пользователю, уже использован или просрочен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: REWARD_UNAVAILABLE
            message: Награда недоступна

    RewardDefinitionNotFound:
      description: Описание награды с указанным кодом не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND_DEFINITION
            message: Награда не найдена

    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка сервер