# yaml-language-server: $schema=none
version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query.sql"
    schema: "db/schema.sql"
    gen:
      go:
        package: "sqlctask"
        sql_package: "pgx/v5"
        out: "sqlc"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true