openapi: 3.0.3

info:
  title: Avito Tamagotchi Tasks API
  description: API для работы с задачами пользователя
  version: 1.0.0

servers:
  - url: http://localhost:8081/api/v1

tags:
  - name: Tasks
    description: Работа с задачами пользователя

security:
  - BearerAuth: []

paths:
  /tasks:
    get:
      tags:
        - Tasks
      summary: Получить задачи пользователя
      description: Возвращает список актуальных задач текущего пользователя.
      operationId: getTodayTasks

      responses:
        "200":
          description: Список задач успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasksResponse"
              example:
                date: "2026-08-08"
                items:
                  - id: "3fa8f58f-a237-4fce-9a35-c027ce4e0de1"
                    title: "Обнови объявление"
                    description: "Актуализируй информацию в своём объявлении"
                    reward_coins: 50
                    reward_xp: 200
                    status: "active"
                    completed_at: null
                    task_type: "Продажи"

                  - id: "75ced52a-539c-4304-afd5-5140b268da3f"
                    title: "Начни продавать"
                    description: "Опубликуй новое объявление"
                    reward_coins: 80
                    reward_xp: 400
                    status: "active"
                    completed_at: null
                    task_type: "Продажи"

                  - id: "609b15b5-417b-498d-8eb2-b696d1f8f6a7"
                    title: "Закажи с доставкой"
                    description: "Оформи заказ с Авито Доставкой"
                    reward_coins: 100
                    reward_xp: 500
                    status: "active"
                    completed_at: null
                    task_type: "Доставка"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "500":
          $ref: "#/components/responses/InternalServerError"

       

  /tasks/{task_id}:
    get:
      tags:
        - Tasks
      summary: Получить задачу
      description: Возвращает информацию о конкретной задаче пользователя.
      operationId: getTask

      parameters:
        - $ref: "#/components/parameters/TaskId"

      responses:
        "200":
          description: Задача успешно получена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTask"
              example:
                id: "609b15b5-417b-498d-8eb2-b696d1f8f6a7"
                title: "Закажи с доставкой"
                description: "Оформи заказ с Авито Доставкой"
                reward_coins: 100
                reward_xp: 500
                status: "active"
                completed_at: null
                task_type: "Доставка"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "502":
          $ref: "#/components/responses/ServiceUnavailable"

  /tasks/{task_id}/complete:
    post:
      tags:
        - Tasks
      summary: Завершить задачу
      description: >
        Отмечает задачу текущего пользователя как выполненную,
        начисляет монеты и опыт и возвращает обновлённый баланс.
      operationId: completeTask

      parameters:
        - $ref: "#/components/parameters/TaskId"

      responses:
        "200":
          description: Задача успешно завершена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteTaskResponse"
              example:
                task:
                  id: "609b15b5-417b-498d-8eb2-b696d1f8f6a7"
                  title: "Закажи с доставкой"
                  description: "Оформи заказ с Авито Доставкой"
                  reward_coins: 100
                  reward_xp: 500
                  status: "completed"
                  completed_at: "2026-08-08T21:34:58.100926914Z"
                  task_type: "Доставка"

                awarded:
                  coins: 100
                  xp: 500

                balance:
                  coins: 200

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "409":
          $ref: "#/components/responses/TaskCompletionConflict"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "502":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token

  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      description: UUID задачи
      schema:
        type: string
        format: uuid
      example: "609b15b5-417b-498d-8eb2-b696d1f8f6a7"

  schemas:
    TasksResponse:
      type: object
      required:
        - date
        - items
      properties:
        date:
          type: string
          format: date
          description: Дата, для которой сформирован список задач
          example: "2026-08-08"

        items:
          type: array
          items:
            $ref: "#/components/schemas/UserTask"

    UserTask:
      type: object
      required:
        - id
        - title
        - description
        - reward_coins
        - reward_xp
        - status
        - task_type

      properties:
        id:
          type: string
          format: uuid
          example: "609b15b5-417b-498d-8eb2-b696d1f8f6a7"

        title:
          type: string
          example: "Закажи с доставкой"

        description:
          type: string
          example: "Оформи заказ с Авито Доставкой"

        reward_coins:
          type: integer
          minimum: 0
          example: 100

        reward_xp:
          type: integer
          format: int64
          minimum: 0
          example: 500

        status:
          type: string
          enum:
            - active
            - completed
          example: active

        completed_at:
          type: string
          format: date-time
          nullable: true
          example: null

        task_type:
          type: string
          enum:
            - Ежедневное
            - Автотека
            - Доставка
            - Продажи
            - Отзывы
            - Покупки
          example: "Доставка"

    CompleteTaskResponse:
      type: object
      required:
        - task
        - awarded
        - balance

      properties:
        task:
          $ref: "#/components/schemas/UserTask"

        awarded:
          $ref: "#/components/schemas/Awarded"

        balance:
          $ref: "#/components/schemas/Balance"

    Awarded:
      type: object
      required:
        - coins
        - xp

      properties:
        coins:
          type: integer
          minimum: 0
          example: 100

        xp:
          type: integer
          format: int64
          minimum: 0
          example: 500

    Balance:
      type: object
      required:
        - coins

      properties:
        coins:
          type: integer
          minimum: 0
          example: 200

    Error:
      type: object
      required:
        - code
        - message

      properties:
        code:
          type: string
          example: TASK_NOT_FOUND

        message:
          type: string
          example: Задание не найдено

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_id:
              summary: Некорректный идентификатор
              value:
                code: INVALID_REQUEST
                message: Некорректный идентификатор
            invalid_title:
              summary: Не указано название задания
              value:
                code: INVALID_REQUEST
                message: Название задания обязательно
            invalid_description:
              summary: Не указано описание задания
              value:
                code: INVALID_REQUEST
                message: Описание задания обязательно
            invalid_reward_coins:
              summary: Некорректное количество монет
              value:
                code: INVALID_REQUEST
                message: Количество монет не может быть отрицательным
            invalid_reward_xp:
              summary: Некорректное количество опыта
              value:
                code: INVALID_REQUEST
                message: Количество опыта не может быть отрицательным
            invalid_task_type:
              summary: Не указан тип задания
              value:
                code: INVALID_REQUEST
                message: Тип задания обязателен

    Unauthorized:
      description: Ошибка авторизации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            expired_token:
              summary: Срок действия токена истёк
              value:
                code: UNAUTHORIZED
                message: Срок действия токена истёк
            invalid_token:
              summary: Невалидный токен
              value:
                code: UNAUTHORIZED
                message: Невалидный токен авторизации
            unauthorized:
              summary: Требуется повторная авторизация
              value:
                code: UNAUTHORIZED
                message: Требуется повторная авторизация

    TaskNotFound:
      description: Задание не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: TASK_NOT_FOUND
            message: Задание не найдено

    UserNotFound:
      description: Пользователь не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: USER_NOT_FOUND
            message: Пользователь не найден

    NotFound:
      description: Задание или пользователь не найдены
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            task_not_found:
              summary: Задание не найдено
              value:
                code: TASK_NOT_FOUND
                message: Задание не найдено
            user_not_found:
              summary: Пользователь не найден
              value:
                code: USER_NOT_FOUND
                message: Пользователь не найден

    TaskCompletionConflict:
      description: Награда за задание уже была получена
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: TASK_ALREADY_COMPLETED
            message: Награда за это задание уже получена

    ServiceUnavailable:
      description: Зависимый сервис временно недоступен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            user_service_unavailable:
              summary: Сервис пользователей недоступен
              value:
                code: USER_SERVICE_UNAVAILABLE
                message: Сервис пользователей временно недоступен
            pet_service_unavailable:
              summary: Сервис питомца недоступен
              value:
                code: PET_SERVICE_UNAVAILABLE
                message: Сервис питомца временно недоступен

    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка сервера
